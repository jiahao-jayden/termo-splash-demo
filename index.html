<html lang="zh-CN">

  <style>
    :root {
      --paper: #191919;
      --canvas: #151515;
      --sidebar: #212121;
      --text: #E9E9E9;
      --muted: rgba(255, 255, 255, 0.55);
      --passive: #929091;
      --border: rgba(255, 255, 255, 0.12);
      --mascot: #82B8E8;
      --mascot-ink: #18364F;
      --confetti: #EFBD47;
      --primary: #549FFF;
      --brand-from: #3F80EF;
      --brand-to: #275FD1;
      --ivory: #F2EADF;
      --selected: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.06);
      --font-sans: "IBM Plex Sans", "IBM Plex Sans Variable", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "IBM Plex Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      --sidebar-w: 0px;
      --ele-css: 480px;
      --chrome-o: 0;
      --empty-o: 0;
      --word-o: 0;
      --titlebar-h: 36px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }

    .desk {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 36px 40px 64px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(63, 128, 239, 0.07), transparent 60%),
        var(--canvas);
    }

    .window {
      width: min(1200px, 100%);
      height: min(720px, 100%);
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--titlebar-h) 1fr;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.45);
    }

    .tb-left, .tb-right, .sidebar, .paper {
      min-width: 0;
      min-height: 0;
    }
    .tb-left {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      background: var(--sidebar);
      padding-left: 0;
    }
    .tb-right {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      background: var(--paper);
      color: var(--text);
      opacity: var(--chrome-o);
    }
    .lights-slot {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: var(--titlebar-h);
      display: flex;
      align-items: center;
      padding-left: 14px;
      gap: 8px;
      z-index: 5;
      pointer-events: none;
    }
    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2);
    }
    .light.r { background: #ff5f57; }
    .light.y { background: #febc2e; }
    .light.g { background: #28c840; }

    .tb-tools, .paper-tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tb-left .tb-tools {
      margin-left: auto;
      margin-right: 6px;
      opacity: var(--chrome-o);
    }
    .icon-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }
    .paper-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .paper-title svg { color: var(--muted); }

    .sidebar {
      grid-column: 1;
      grid-row: 2;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 4px 8px 10px;
      opacity: var(--chrome-o);
      overflow: hidden;
    }
    .nav-label {
      font-size: 11px;
      color: var(--passive);
      padding: 10px 8px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
    }
    .row.selected { background: var(--selected); }
    .row svg { flex: none; color: var(--muted); }
    .row.selected svg { color: var(--text); }
    .folder-row svg { color: var(--mascot); }
    .sidebar-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .paper {
      grid-column: 2;
      grid-row: 2;
      background: var(--paper);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .cluster {
      position: relative;
      width: calc(var(--ele-css) * 160 / 240);
      height: calc(var(--ele-css) * 160 / 240);
      flex: none;
      overflow: visible;
    }
    canvas {
      position: absolute;
      width: var(--ele-css);
      height: var(--ele-css);
      left: calc(var(--ele-css) * -40 / 240);
      top: calc(var(--ele-css) * -40 / 240);
      display: block;
    }

    .caption {
      position: relative;
      width: 280px;
      min-height: 88px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }
    .wordmark {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text);
      opacity: var(--word-o);
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .caret {
      display: inline-block;
      width: 8px;
      height: 22px;
      margin-left: 3px;
      background: var(--primary);
      border-radius: 1px;
      vertical-align: -3px;
      transform-origin: center;
    }
    .caret.on { opacity: 1; }
    .caret.off { opacity: 0; }
    .empty {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      opacity: var(--empty-o);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }
    .empty h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .empty p {
      font-size: 13px;
      color: var(--muted);
      max-width: 220px;
      line-height: 1.45;
    }
    .new-btn {
      margin-top: 8px;
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: var(--paper);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .controls button {
      height: 30px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1c1c1c;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .controls button:hover { background: #262626; }
    .controls button[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--border));
      color: var(--primary);
    }
    .credit {
      position: fixed;
      right: 20px;
      bottom: 20px;
      font-size: 11px;
      color: var(--passive);
      letter-spacing: 0.06em;
    }

    @media (prefers-reduced-motion: reduce) {
      .caret { animation: none; opacity: 1; }
    }
  </style>
</head>

    }

    if (t >= T.trunkAt && t < T.trunkAt + T.trunkDur) {
      const p = (t - T.trunkAt) / T.trunkDur;
      s.trunk = Math.sin(p * Math.PI * 2.1) * 16 * Math.sin(p * Math.PI);
    }

    if (t >= T.total) {
      const idle = t - T.total;
      const p = (idle % 3) / 3;
      const w = p * Math.PI * 2;
      s.bob = Math.sin(w) * 1.4;
      s.trunk = Math.sin(w) * 3;
      s.blink = p > 0.8 && p < 0.85 ? 0.15 : 1;
      s.sidebar = SIDEBAR_W;
      s.ele = ELE_SHELL;
      s.chrome = 1;
      s.empty = 1;
      s.word = 0;
      s.caret = false;
    }

    return s;
  }

  function pixelProgress(p, t) {
    if (reduced || t >= T.shellAt) return 1;
    const u = (t - p.delay) / T.flight;
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return easeOutBack(u);
  }

  function drawMascot(ox, oy, blink, trunkDeg) {
    ctx.save();
    ctx.translate(ox, oy);
    for (const p of BODY_P2) {
      ctx.fillStyle = FILL[p.fill];
      ctx.fill(p.path);
    }
    ctx.save();
    ctx.translate(80, 74);
    ctx.scale(1, blink);
    ctx.translate(-80, -74);
    ctx.fillStyle = INK;
    ctx.fillRect(60, 70, 6, 8);
    ctx.fillRect(94, 70, 6, 8);
    ctx.restore();
    ctx.save();
    ctx.translate(80, 87);
    ctx.rotate((trunkDeg * Math.PI) / 180);
    ctx.translate(-80, -87);
    for (const p of TRUNK_P2) {
      ctx.fillStyle = FILL[p.fill];
      ctx.fill(p.path);
    }
    ctx.restore();
    ctx.restore();
  }

  const landEnd = Math.max(...parts.map((p) => p.delay)) + T.flight;

  function draw(t) {
    sizeCanvas();
    const s = timeline(t);
    applyChrome(s);

    ctx.clearRect(0, 0, VIEW, VIEW);

    const assembling = !reduced && t < landEnd;
    const landedRatio = assembling
      ? parts.reduce((n, p) => n + (pixelProgress(p, t) >= 1 ? 1 : 0), 0) / parts.length
      : 1;
    const usePaths = !assembling || landedRatio >= 0.7;
    const glowT = reduced ? 0 : clamp(t / 0.3, 0, 1) * (t < 0.62 ? 1 : clamp(1 - (t - 0.62) / 0.18, 0, 1));
    if (glowT > 0.01) {
      const g = ctx.createRadialGradient(PAD + 80, PAD + 86, 10, PAD + 80, PAD + 86, 90);
      g.addColorStop(0, "rgba(130,184,232," + (0.16 * glowT) + ")");
      g.addColorStop(1, "rgba(130,184,232,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(PAD + 80, PAD + 86, 90, 0, Math.PI * 2);
      ctx.fill();
    }

    if (landedRatio > 0.4) {
      ctx.save();
      ctx.fillStyle = SHADE;
      ctx.globalAlpha = 0.12 * clamp((landedRatio - 0.4) / 0.5, 0, 1);
      ctx.beginPath();
      ctx.ellipse(PAD + 80, PAD + 137 + s.bob, 37, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const ox = PAD;
    const oy = PAD + s.bob;

    if (usePaths) {
      drawMascot(ox, oy, s.blink, s.trunk);
    }
    if (assembling) {
      const trunkOriginX = ox + 80;
      const trunkOriginY = oy + 87;
      const trunkRad = (s.trunk * Math.PI) / 180;
      for (const g of [0, 1, 2]) {
        for (const p of parts) {
          if (p.g !== g) continue;
          const prog = pixelProgress(p, t);
          if (prog <= 0) continue;
          if (usePaths && prog >= 1) continue;
          let px, py, rot, scale, alpha;
          if (prog >= 1) {
            px = p.mx; py = p.my; rot = 0; scale = 1; alpha = 1;
          } else {
            const k = prog;
            px = lerp(p.sx, p.mx, k);
            py = lerp(p.sy, p.my, k);
            rot = p.rot0 * (1 - k);
            scale = lerp(0.45, 1, k);
            alpha = clamp(k / 0.35, 0, 1);
          }
          let gx = ox + px;
          let gy = oy + py;
          if (prog >= 1 && p.g === 1 && s.trunk) {
            const lx = px - 80;
            const ly = py - 87;
            const c = Math.cos(trunkRad);
            const si = Math.sin(trunkRad);
            gx = trunkOriginX + lx * c - ly * si;
            gy = trunkOriginY + lx * si + ly * c;
          } else if (prog >= 1 && p.g === 2 && s.blink !== 1) {
            gx = ox + px;
            gy = oy + 74 + (py - 74) * s.blink;
          }
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = DATA.pal[p.ci];
          ctx.translate(gx, gy);
          if (rot) ctx.rotate(rot);
          if (scale !== 1) ctx.scale(scale, scale);
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      }
    }

    if (!reduced && t >= T.confettiAt && t < T.confettiAt + T.confettiDur + 0.05) {
      const raw = (t - T.confettiAt) / T.confettiDur;
      for (const c of confetti) {
        const q = clamp(raw - c.phase * 0.15, 0, 1);
        if (q <= 0) continue;
        const x = ox + 80 + c.side * (20 + q * c.spread);
        const y = oy + 62 - c.lift * q + c.grav * q * q;
        const a = q < 0.8 ? 1 : (1 - q) / 0.2;
        ctx.globalAlpha = a;
        ctx.fillStyle = c.color;
        ctx.fillRect(x, y, c.size, c.size);
      }
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    if (!playing) return;
    const dt = lastNow ? Math.min((now - lastNow) / 1000, 0.05) : 0;
    lastNow = now;
    t1x += dt * speed;
    draw(t1x);
    raf = requestAnimationFrame(frame);
  }

  function play(nextSpeed) {
    if (typeof nextSpeed === "number") setSpeed(nextSpeed);
    cancelAnimationFrame(raf);
    t1x = 0;
    lastNow = 0;
    playing = true;
    if (reduced) {
      draw(T.total + 0.01);
      playing = false;
      return;
    }
    draw(0);
    raf = requestAnimationFrame(frame);
  }

  function setSpeed(v) {
    speed = v === 0.5 ? 0.5 : 1;
    speedBtn.textContent = speed === 1 ? "1×" : "0.5×";
    speedBtn.setAttribute("aria-pressed", speed === 0.5 ? "true" : "false");
  }

  replayBtn.addEventListener("click", () => play());
  speedBtn.addEventListener("click", () => setSpeed(speed === 1 ? 0.5 : 1));
  window.addEventListener("keydown", (e) => {
    if (e.key === " " && e.target === document.body) {
      e.preventDefault();
      play();
    } else if (e.key === "t" || e.key === "T") {
      setSpeed(speed === 1 ? 0.5 : 1);
    }
  });
  window.addEventListener("resize", () => draw(t1x));

  window.__splash = {
    play,
    setSpeed,
    seek(t) { playing = false; cancelAnimationFrame(raf); t1x = t; draw(t); },
    get time() { return t1x; },
    get speed() { return speed; },
    duration: T.total,
    reduced
  };

  setSpeed(1);
  play(1);
  </script>
</body>
</html>
